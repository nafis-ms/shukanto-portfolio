<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Admin | Shukanto Shishir</title>
  <script>(function () { var t = "dark"; try { var s = localStorage.getItem("theme"); if (s === "light" || s === "dark") t = s } catch (e) { } document.documentElement.setAttribute("data-theme", t) })()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
:root{--bg:#000405;--panel:#08131a;--side:#050e14;--ink:#eaf4fb;--dim:rgba(187,225,250,.66);--line:rgba(187,225,250,.14);--blue:#3282b8;--ice:#bbe1fa;--navy:#0f4c75;--bad:#ff9fb0;--ok:#8fe3b0;--fill:rgba(15,76,117,.18);--hover:rgba(50,130,184,.2);--ring:rgba(50,130,184,.28);--topbg:rgba(0,4,5,.82);--chipbg:rgba(15,76,117,.2);--chipbd:rgba(50,130,184,.45);--tbg:#0f4c75;--tink:#eaf4fb;--badbg:#4a1623;--delbg:rgba(255,159,176,.1);--onpri:#021018;--glow:rgba(50,130,184,.45);--shadow:0 18px 50px rgba(0,0,0,.45);--orb1:#0f4c75;--orb2:#3282b8;color-scheme:dark;--e:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{--bg:#FFF8F1;--panel:#fff;--side:#FDEBDB;--ink:#2B1B12;--dim:rgba(43,27,18,.7);--line:rgba(154,52,18,.18);--blue:#EA6A12;--ice:#C2410C;--navy:#C2410C;--bad:#b91c1c;--ok:#15803d;--fill:rgba(255,248,241,.9);--hover:rgba(234,106,18,.13);--ring:rgba(234,106,18,.25);--topbg:rgba(255,248,241,.85);--chipbg:rgba(254,215,170,.45);--chipbd:rgba(234,106,18,.5);--tbg:#C2410C;--tink:#fff;--badbg:#fee2e2;--delbg:rgba(185,28,28,.08);--onpri:#fff;--glow:rgba(234,106,18,.4);--shadow:0 18px 40px rgba(154,52,18,.14);--orb1:#fdba74;--orb2:#fb923c;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.serif,h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:400}
a{color:var(--ice)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
button{white-space:nowrap;cursor:pointer;background:none;border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 18px;font-size:14px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .25s,border-color .25s,color .25s,transform .2s var(--e),box-shadow .3s}
button:hover{background:var(--hover);border-color:var(--blue)}
button:active{transform:scale(.97)}
button.pri{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--ice),var(--blue));color:var(--onpri);border-color:transparent;font-weight:500;box-shadow:0 6px 20px -8px var(--glow)}
button.pri:hover{transform:translateY(-1px);box-shadow:0 10px 26px -8px var(--glow);filter:brightness(1.07)}
button.pri::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-160%) skewX(-20deg)}
button.pri:hover::after{transition:transform .9s var(--e);transform:translateX(330%) skewX(-20deg)}
button.del{color:var(--bad)}
button.del:hover{border-color:var(--bad);background:var(--delbg)}
button:disabled{opacity:.55;cursor:default;transform:none}
input[type=text],input[type=password],input[type=email],input[type=datetime-local],textarea,select{width:100%;background:var(--fill);border:1px solid var(--line);border-radius:10px;padding:11px 14px;transition:border-color .25s,box-shadow .25s,background .25s}
textarea{resize:vertical;min-height:110px;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px var(--ring)}
select{cursor:pointer}select:disabled{opacity:.55;cursor:not-allowed}select option{background:var(--panel);color:var(--ink)}
input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-height:44px}
input[type=file]{max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-size:13px;color:var(--ink);background:var(--fill);border:1px solid var(--line);border-radius:8px;padding:7px 14px;margin-right:10px;cursor:pointer;transition:.25s}
input[type=file]::file-selector-button:hover{border-color:var(--blue);background:var(--hover)}

/* ===== login ===== */
.login{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:hidden}
.login[hidden]{display:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none}
.orb.a{width:46vmax;height:46vmax;left:-14vmax;top:-18vmax;background:var(--orb1);animation:drift 16s ease-in-out infinite alternate}
.orb.b{width:38vmax;height:38vmax;right:-12vmax;bottom:-16vmax;background:var(--orb2);opacity:.28;animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.lgrid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask:radial-gradient(ellipse 60% 60% at 50% 50%,#000,transparent);mask:radial-gradient(ellipse 60% 60% at 50% 50%,#000,transparent);opacity:.7}
.lcard{position:relative;width:min(420px,100%);padding:clamp(26px,5vw,40px);border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--panel) 82%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow);animation:rise .9s var(--e) backwards}
.lcard.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}}
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;font-family:"Playfair Display",Georgia,serif;font-size:24px;color:var(--onpri);background:linear-gradient(135deg,var(--ice),var(--blue));box-shadow:0 8px 26px -6px var(--glow)}
.lcard .logo{margin-bottom:22px;animation:pop .9s var(--e) .25s backwards}
@keyframes pop{from{transform:scale(.4) rotate(-30deg);opacity:0}}
.lcard h1{font-size:34px;line-height:1.1}
.lcard .lead{margin:8px 0 0}
.lcard form{display:grid;gap:14px;margin-top:24px}
.pwrap{position:relative}
.pwrap input{padding-right:48px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;min-height:40px;padding:0;border:0;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.eye:active{transform:translateY(-50%) scale(.92)}
.eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#loginMsg{color:var(--bad);min-height:1.5em;margin-top:12px;font-size:14px}
.login .tm{position:fixed;top:16px;right:16px;z-index:2}
button.busy{pointer-events:none}
button.busy::before{content:"";display:inline-block;width:14px;height:14px;margin-right:9px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* theme toggle */
.tm{width:40px;padding:0;display:grid;place-items:center;border-radius:50%;flex:none}
.tm svg{grid-area:1/1;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .6s var(--e)}
.tm:hover svg{transform:rotate(60deg)}
.tm .i-moon{display:none}
:root[data-theme=light] .tm .i-sun{display:none}
:root[data-theme=light] .tm .i-moon{display:block}
html.tt *,html.tt *::before,html.tt *::after{transition:background-color .35s ease,color .35s ease,border-color .35s ease}

/* ===== app shell ===== */
#app{min-height:100vh;display:grid;grid-template-columns:272px minmax(0,1fr)}
#app[hidden]{display:none}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:22px 16px 16px;background:var(--side);border-right:1px solid var(--line);z-index:40;animation:slideIn .8s var(--e) backwards}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px}
.brand b{display:block;font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:19px;line-height:1.1}
.brand small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:3px}
#tabs{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;margin:0 -4px;padding:0 4px}
.ng{margin-bottom:18px}
.ngl{padding:0 12px 6px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);opacity:.8}
.ni{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;text-align:left;color:var(--dim);background:none;z-index:1;animation:navIn .6s var(--e) calc(.15s + var(--i,0)*.05s) backwards}
@keyframes navIn{from{opacity:0;transform:translateX(-14px)}}
.ni svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--e)}
.ni:hover{background:var(--hover);color:var(--ink)}
.ni:hover svg{transform:scale(1.14)}
.ni.on{color:var(--ink);background:none}
.ni.on svg{stroke:var(--ice)}
.ni .cnt{margin-left:auto;min-width:22px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;text-align:center;color:var(--dim)}
.ni .cnt.hot{background:var(--ice);border-color:var(--ice);color:var(--onpri);font-weight:500;animation:beat 2s ease-in-out infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 var(--glow)}60%{box-shadow:0 0 0 7px transparent}}
.ind{position:absolute;left:4px;right:4px;top:0;height:42px;border-radius:10px;background:linear-gradient(90deg,var(--hover),transparent);border:1px solid var(--line);z-index:0;transition:transform .5s var(--e),opacity .3s;opacity:0}
.ind::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--ice);box-shadow:0 0 12px var(--ice)}
.side-foot{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.side-foot a,.side-foot button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;text-decoration:none;color:var(--ink)}
.side-foot a:hover{background:var(--hover);border-color:var(--blue)}
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px clamp(16px,3.4vw,40px);background:var(--topbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{font-size:13.5px;color:var(--dim)}
.crumb b{color:var(--ink);font-weight:500}
.crumb i{font-style:normal;margin:0 8px;opacity:.5}
.grow{flex:1;min-width:0}
.bar .vw{font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.burger{display:none;width:40px;padding:0;place-items:center}
.burger svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:clamp(20px,3vw,38px) clamp(16px,3.4vw,40px) 90px}
.phead{margin-bottom:24px}
.phead.go>*{animation:rise .8s var(--e) backwards}
.phead.go p{animation-delay:.08s}
.phead .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ice);margin-bottom:8px}
.phead .eyebrow::before{content:"";width:26px;height:1px;background:var(--ice)}
.phead h1{font-size:clamp(30px,4vw,44px);line-height:1.08}
.phead p{margin-top:8px;color:var(--dim);max-width:60ch}

/* ===== cards and content ===== */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px);margin-bottom:20px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -18px rgba(0,0,0,.5);animation:rise .7s var(--e) calc(var(--i,0)*70ms) backwards;transition:border-color .35s,box-shadow .35s}
.card:hover{border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.card h2{display:flex;align-items:center;gap:12px;font-size:23px;line-height:1.2;margin-bottom:4px}
.card h2::before{content:"";width:4px;height:22px;border-radius:4px;background:linear-gradient(var(--ice),var(--blue))}
.lead{color:var(--dim);font-size:14px;margin-bottom:22px}
.card>.lead{padding-left:16px}
.fld{margin-bottom:18px}
.fld>label{display:block;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--dim);margin-bottom:7px}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px;opacity:.9}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rowi{display:flex;gap:12px;align-items:center;padding:14px 10px;margin:0 -10px;border-top:1px solid var(--line);border-radius:10px;animation:rise .6s var(--e) calc(var(--i,0)*45ms) backwards;transition:background .25s}
.rowi:first-of-type{border-top:0}
.rowi:hover{background:var(--hover)}
.rowi .grow{flex:1;min-width:0}
.rowi b{font-weight:500;display:block}
.rowi p{color:var(--dim);font-size:13.5px;overflow-wrap:anywhere}
.ico{width:46px;height:46px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--fill)}
.ico svg{width:24px;height:24px;fill:none;stroke:var(--blue);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 14px;border:1px solid var(--chipbd);border-radius:999px;background:var(--chipbg);color:var(--ice);font-size:13.5px;animation:chipIn .5s cubic-bezier(.34,1.56,.64,1) calc(var(--i,0)*30ms) backwards}
@keyframes chipIn{from{opacity:0;transform:scale(.6)}}
.chip button{min-height:24px;width:24px;padding:0;border:0;border-radius:50%;line-height:1}
.addline{display:flex;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:6px}
.pj{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);animation:rise .6s var(--e) calc(var(--i,0)*45ms) backwards;transition:transform .45s var(--e),box-shadow .45s,border-color .3s}
.pj:hover{transform:translateY(-5px);border-color:var(--blue);box-shadow:0 18px 36px -16px var(--glow)}
.pj img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;transition:transform .8s var(--e)}
.pj:hover img{transform:scale(1.05)}
.pj div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 10px}
.pj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}
.pj button{min-height:32px;padding:0 12px;font-size:13px}
.pj p.noimg{aspect-ratio:3/2;display:grid;place-items:center;background:var(--fill);color:var(--dim);font-size:13px}
.pj p.pcat{padding:10px 10px 0}
.pj p.pcat select{padding:7px 10px;font-size:13px;border-radius:8px}
.imgbox{overflow:hidden;position:relative}
.prev{display:block;max-width:240px;aspect-ratio:3/2;object-fit:cover;border-radius:10px;margin-top:12px;border:1px solid var(--line);animation:rise .5s var(--e)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--ice);margin-left:6px}
.q{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:17px;overflow-wrap:anywhere;margin:8px 0}
.meta{font-size:12.5px;color:var(--dim);margin-bottom:12px}
.act{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--dim);padding:6px 0 4px}
.empty.big{display:grid;justify-items:center;gap:10px;padding:34px 10px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.empty.big svg{width:34px;height:34px;fill:none;stroke:var(--blue);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opts label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;font-size:14px;transition:.25s}
.opts label:hover{border-color:var(--blue);background:var(--hover)}
.opts input{accent-color:var(--ice)}
/* segmented switch (Feedback) */
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;margin-bottom:22px;border:1px solid var(--line);border-radius:12px;background:var(--fill)}
.tabs button{border:0;min-height:36px;border-radius:9px;padding:0 16px;color:var(--dim)}
.tabs button:hover{color:var(--ink);background:var(--hover)}
.tabs button.on{background:linear-gradient(135deg,var(--ice),var(--blue));color:var(--onpri);font-weight:500;box-shadow:0 4px 14px -6px var(--glow)}
.skel{height:84px;border-radius:12px;margin-bottom:12px;background:linear-gradient(100deg,var(--fill) 30%,var(--hover) 50%,var(--fill) 70%) 0 0/300% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-300% 0}}
.fbi{display:block;padding:18px 10px;margin:0 -10px;border-top:1px solid var(--line);border-radius:10px;animation:rise .6s var(--e) calc(var(--i,0)*55ms) backwards}
.fbi:first-of-type{border-top:0}

/* overview */
.hello{display:flex;align-items:center;gap:18px;padding:clamp(20px,3vw,30px);margin-bottom:20px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at 100% 0,var(--hover),transparent 60%),var(--panel);position:relative;overflow:hidden;animation:rise .7s var(--e) backwards}
.hello::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid var(--line);box-shadow:0 0 0 30px color-mix(in srgb,var(--blue) 6%,transparent),0 0 0 62px color-mix(in srgb,var(--blue) 4%,transparent);animation:ripple 5s ease-in-out infinite}
@keyframes ripple{50%{transform:scale(1.12)}}
.hello h2{font-size:clamp(24px,3vw,32px);line-height:1.15}
.hello p{color:var(--dim);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat{display:grid;justify-items:start;gap:2px;min-height:0;padding:18px;text-align:left;background:var(--panel);border-radius:16px;animation:rise .7s var(--e) calc(var(--i,0)*70ms) backwards}
.stat:hover{transform:translateY(-4px);box-shadow:0 18px 34px -18px var(--glow)}
.stat .si{display:grid;place-items:center;width:38px;height:38px;margin-bottom:10px;border-radius:10px;background:var(--hover);border:1px solid var(--line)}
.stat .si svg{width:20px;height:20px;fill:none;stroke:var(--ice);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stat .num{font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stat span:last-child{font-size:13px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--dim);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill.live::before{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:live 2s ease-out infinite}
@keyframes live{70%{box-shadow:0 0 0 7px transparent}}
.quick{display:flex;gap:10px;flex-wrap:wrap}

/* ===== modal ===== */
.mdl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .25s ease}
.mdl.out{opacity:0;transition:opacity .2s}
@keyframes fade{from{opacity:0}}
.mbox{width:min(420px,100%);padding:26px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);animation:mpop .45s var(--e)}
@keyframes mpop{from{opacity:0;transform:translateY(16px) scale(.94)}}
.mbox h3{font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:22px;margin-bottom:8px}
.mbox p{color:var(--dim);font-size:14.5px;overflow-wrap:anywhere}
.mbox input{margin-top:14px}
.mbox .act{justify-content:flex-end;margin-top:22px}
.mbox button.danger{background:var(--bad);border-color:var(--bad);color:#1a0509}

/* ===== toast ===== */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.96);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;background:var(--tbg);color:var(--tink);border:1px solid var(--blue);padding:12px 20px 12px 14px;border-radius:14px;font-size:14px;z-index:90;max-width:90vw;overflow:hidden;box-shadow:var(--shadow);transition:opacity .35s,transform .45s var(--e)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
#toast .ti{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:50%;background:rgba(255,255,255,.18)}
#toast .ti svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#toast i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:currentColor;opacity:.5;transform-origin:left}
#toast.show i{animation:tbar 3.2s linear forwards}
@keyframes tbar{to{transform:scaleX(0)}}

/* ===== responsive ===== */
@media(max-width:900px){
 #app{display:block}
 .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,84vw);transform:translateX(-102%);transition:transform .5s var(--e);animation:none;box-shadow:var(--shadow)}
 body.nav-open .side{transform:none}
 body.nav-open .scrim{opacity:1;pointer-events:auto}
 body.nav-open{overflow:hidden}
 .burger{display:grid}
 .ni{animation:none}
}
@media(max-width:768px){input,textarea,select{font-size:16px}}
@media(max-width:640px){.row2{grid-template-columns:1fr}.hello::after{display:none}}
@media(pointer:coarse){button{min-height:44px}.chip button{min-height:30px;width:30px}.pj button{min-height:40px}textarea{font-size:16px!important}}
@media(max-width:520px){.rowi{flex-wrap:wrap}.rowi>button{margin-left:auto}.pgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.addline{flex-wrap:wrap}.addline>button{flex:1}.prev{max-width:100%}.pj div{flex-direction:column;align-items:stretch;gap:6px}.pj span{text-align:center}.pj button{width:100%}.bar .vw span{display:none}.tabs{display:flex}.tabs button{flex:1;padding:0 8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  .slist{margin-top:6px}
.slr{display:grid;grid-template-columns:minmax(0,1.5fr) 88px minmax(110px,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);animation:chipIn .5s cubic-bezier(.34,1.56,.64,1) calc(var(--i,0)*30ms) backwards}
.slr input[type=number]{width:100%;font:inherit;color:inherit;background:var(--fill);border:1px solid var(--line);border-radius:10px;padding:11px 10px;text-align:center}
.slr input[type=number]:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.slr input[type=range]{width:100%;accent-color:var(--blue);min-height:0;padding:0;background:none;border:0}
.slr .mv{display:flex;gap:6px}
.slr .mv button{min-width:36px;padding:6px 10px}
.sadd{display:grid;grid-template-columns:minmax(0,1.5fr) 88px auto;gap:10px;align-items:center;margin-top:16px}
.sadd input[type=number]{width:100%;font:inherit;color:inherit;background:var(--fill);border:1px solid var(--line);border-radius:10px;padding:11px 10px;text-align:center}
.sbarp{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px;grid-column:1/-1}
.sbarp i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--blue),var(--ice));transition:width .25s}
@media(max-width:620px){.slr{grid-template-columns:minmax(0,1fr) 84px}.slr input[type=range]{grid-column:1/-1}.slr .mv{grid-column:1/-1;justify-content:flex-end}.sadd{grid-template-columns:minmax(0,1fr) 84px}.sadd button{grid-column:1/-1}}

              if (!/\.pdf$/i.test(fl.name) && fl.type !== "application/pdf") return toast("That is not a PDF.", true);
              if (fl.size > CV_MAX) return toast("That file is too large (3 MB max).", true);
              b.disabled = true; b.textContent = "Uploading\u2026";
              readPdf(fl).then(function (data) { return api("/api/index?p=admin/content/cv", "POST", { name: fl.name.replace(/[\\\/]/g, "_"), data: data }) })
                .then(function (x) { D = x; toast("CV saved."); show("CV") })
                .catch(function (e) { toast(e.message, true); b.disabled = false; b.textContent = label });
            }
          });
          f.appendChild(b); p.appendChild(f);
        }

        /* ---------- Social ---------- */
        function Social(p) {
          var s = D.social || {}, c = card("Social links", "Shown in the Social section, just above Contact. Leave a field empty to hide that icon. If every field is empty, the whole section is hidden.");
          var ig = inp(s.instagram, { maxlength: 300, placeholder: "https://instagram.com/yourname" }),
            li = inp(s.linkedin, { maxlength: 300, placeholder: "https://linkedin.com/in/yourname" }),
            fb = inp(s.facebook, { maxlength: 300, placeholder: "https://facebook.com/yourname" }),
            wa = inp(s.whatsapp ? "+" + s.whatsapp : "", { maxlength: 40, placeholder: "+8801712345678", inputmode: "tel" });
          c.appendChild(fld("Instagram", ig, "Paste your profile link."));
          c.appendChild(fld("LinkedIn", li, "Paste your profile link."));
          c.appendChild(fld("Facebook", fb, "Paste your profile or page link."));
          c.appendChild(fld("WhatsApp number", wa, "Include the country code (Bangladesh is +880) and leave out the leading 0. Tapping the icon opens a WhatsApp chat with this number."));
          c.appendChild(h("button", {
            type: "button", class: "pri", text: "Save social links", onclick: function () {
              saveC("social", { instagram: ig.value, linkedin: li.value, facebook: fb.value, whatsapp: wa.value }, "Social links saved.", function () { show("Social") });
            }
          }));
          p.appendChild(c);
        }

        /* ---------- Contact ---------- */
        function Contact(p) {
          var c = card("Contact email", "The email used by the Email me button and the footer."), em = inp(D.contactEmail, { type: "email", maxlength: 120 });
          c.appendChild(fld("Contact email", em, "The email in the About section is changed under About."));
          c.appendChild(h("button", { type: "button", class: "pri", text: "Save email", onclick: function () { saveC("contact", { email: em.value }, "Contact email saved.") } }));
          p.appendChild(c);
        }
      })();
  </script>
</body>

</html>
