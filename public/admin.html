<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <script>(function () { var t = "dark"; try { var s = localStorage.getItem("theme"); if (s === "light" || s === "dark") t = s } catch (e) { } document.documentElement.setAttribute("data-theme", t) })()</script>
  <style>
    :root {
      --bg: #000405;
      --panel: #08131a;
      --ink: #eaf4fb;
      --dim: rgba(187, 225, 250, .66);
      --line: rgba(187, 225, 250, .16);
      --blue: #3282b8;
      --ice: #bbe1fa;
      --navy: #0f4c75;
      --bad: #ff9fb0;
      --ok: #8fe3b0;
      --fill: rgba(15, 76, 117, .18);
      --hover: rgba(50, 130, 184, .2);
      --ring: rgba(50, 130, 184, .22);
      --topbg: rgba(0, 4, 5, .92);
      --chipbg: rgba(15, 76, 117, .2);
      --chipbd: rgba(50, 130, 184, .45);
      --tbg: #0f4c75;
      --tink: #eaf4fb;
      --badbg: #4a1623;
      --delbg: rgba(255, 159, 176, .1);
      color-scheme: dark
    }

    /* light theme: same palette as the site (shared "theme" choice, so the admin follows the site toggle) */
    :root[data-theme=light] {
      --bg: #FFF8F1;
      --panel: #FDEBDB;
      --ink: #2B1B12;
      --dim: rgba(43, 27, 18, .7);
      --line: rgba(154, 52, 18, .2);
      --blue: #EA6A12;
      --ice: #C2410C;
      --navy: #C2410C;
      --bad: #b91c1c;
      --ok: #15803d;
      --fill: rgba(255, 255, 255, .75);
      --hover: rgba(234, 106, 18, .15);
      --ring: rgba(234, 106, 18, .2);
      --topbg: rgba(255, 248, 241, .92);
      --chipbg: rgba(254, 215, 170, .45);
      --chipbd: rgba(234, 106, 18, .5);
      --tbg: #C2410C;
      --tink: #fff;
      --badbg: #fee2e2;
      --delbg: rgba(185, 28, 28, .08);
      color-scheme: light
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif
    }

    .serif,
    h1,
    h2 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 400
    }

    a {
      color: var(--ice)
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      min-height: 40px;
      padding: 0 18px;
      font-size: 14px;
      transition: background .25s, border-color .25s, color .25s
    }

    button:hover {
      background: var(--hover);
      border-color: var(--blue)
    }

    button.pri {
      background: var(--ice);
      color: var(--bg);
      border-color: var(--ice)
    }

    button.pri:hover {
      background: transparent;
      color: var(--ice)
    }

    button.del {
      color: var(--bad)
    }

    button.del:hover {
      border-color: var(--bad);
      background: var(--delbg)
    }

    button:disabled {
      opacity: .5;
      cursor: default
    }

    input[type=text],
    input[type=password],
    input[type=email],
    input[type=datetime-local],
    textarea {
      width: 100%;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 14px
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.5
    }

    input:focus,
    textarea:focus {
      outline: 0;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--ring)
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--topbg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 14px clamp(16px, 4vw, 40px);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap
    }

    .top h1 {
      font-size: 24px;
      margin-right: auto
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(18px, 3vw, 36px) clamp(16px, 4vw, 40px) 80px
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 26px
    }

    .tabs button.on {
      background: var(--ice);
      color: var(--bg);
      border-color: var(--ice)
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: clamp(18px, 3vw, 28px);
      margin-bottom: 18px
    }

    .card h2 {
      font-size: 26px;
      margin-bottom: 4px
    }

    .lead {
      color: var(--dim);
      font-size: 14px;
      margin-bottom: 20px
    }

    .fld {
      margin-bottom: 16px
    }

    .fld>label {
      display: block;
      font-size: 13.5px;
      color: var(--dim);
      margin-bottom: 6px
    }

    .hint {
      font-size: 12.5px;
      color: var(--dim);
      margin-top: 5px
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    @media(max-width:640px) {
      .row2 {
        grid-template-columns: 1fr
      }
    }

    .rowi {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 0;
      border-top: 1px solid var(--line)
    }

    .rowi:first-child {
      border-top: 0
    }

    .rowi .grow {
      flex: 1;
      min-width: 0
    }

    .rowi b {
      font-weight: 500;
      display: block
    }

    .rowi p {
      color: var(--dim);
      font-size: 13.5px;
      overflow-wrap: anywhere
    }

    .ico {
      width: 44px;
      height: 44px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px
    }

    .ico svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--blue);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 14px;
      border: 1px solid var(--chipbd);
      border-radius: 999px;
      background: var(--chipbg);
      color: var(--ice);
      font-size: 13.5px
    }

    .chip button {
      min-height: 24px;
      width: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      line-height: 1
    }

    .addline {
      display: flex;
      gap: 10px
    }

    .pgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 6px
    }

    .pj {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg)
    }

    .pj img {
      display: block;
      width: 100%;
      aspect-ratio: 3/2;
      object-fit: cover
    }

    .pj div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px
    }

    .pj span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px
    }

    .pj button {
      min-height: 32px;
      padding: 0 12px;
      font-size: 13px
    }

    .prev {
      display: block;
      max-width: 240px;
      aspect-ratio: 3/2;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid var(--line)
    }

    .tag {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 10px;
      font-size: 12px;
      color: var(--ice);
      margin-left: 6px
    }

    .q {
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-size: 17px;
      overflow-wrap: anywhere;
      margin: 8px 0
    }

    .meta {
      font-size: 12.5px;
      color: var(--dim);
      margin-bottom: 12px
    }

    .act {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .empty {
      color: var(--dim)
    }

    .opts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .opts label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 16px;
      cursor: pointer;
      font-size: 14px
    }

    .opts input {
      accent-color: var(--ice)
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      background: var(--tbg);
      color: var(--tink);
      border: 1px solid var(--blue);
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 14px;
      transition: .3s;
      z-index: 20;
      max-width: 90vw
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    #toast.bad {
      background: var(--badbg);
      border-color: var(--bad);
      color: var(--bad)
    }

    .login {
      max-width: 420px;
      margin: 12vh auto 0;
      padding: 0 20px
    }

    .login form {
      display: grid;
      gap: 12px;
      margin-top: 18px
    }

    /* theme toggle (login screen + top bar) */
    .tm {
      width: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      flex: none
    }

    .tm svg {
      grid-area: 1/1;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .tm .i-moon {
      display: none
    }

    :root[data-theme=light] .tm .i-sun {
      display: none
    }

    :root[data-theme=light] .tm .i-moon {
      display: block
    }

    .login .tm {
      position: fixed;
      top: 16px;
      right: 16px
    }

    html.tt *,
    html.tt *::before,
    html.tt *::after {
      transition: background-color .35s ease, color .35s ease, border-color .35s ease
    }

    /* phones, tablets, keyboards */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%
    }

    :focus-visible {
      outline: 2px solid var(--ice);
      outline-offset: 3px
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent
    }

    .top {
      -webkit-backdrop-filter: blur(8px);
      padding-left: max(clamp(16px, 4vw, 40px), env(safe-area-inset-left, 0px));
      padding-right: max(clamp(16px, 4vw, 40px), env(safe-area-inset-right, 0px))
    }

    input[type=datetime-local] {
      -webkit-appearance: none;
      appearance: none;
      min-height: 44px
    }

    input[type=file] {
      max-width: 100%
    }

    #toast {
      bottom: calc(24px + env(safe-area-inset-bottom, 0px))
    }

    @media(max-width:768px) {

      input,
      textarea {
        font-size: 16px
      }
    }

    /* under 16px, iPhones zoom the page when a field is focused */
    @media(pointer:coarse) {
      button {
        min-height: 44px
      }

      .chip button {
        min-height: 30px;
        width: 30px
      }

      .pj button {
        min-height: 40px
      }
    }

    @media(max-width:520px) {
      .top {
        gap: 10px
      }

      .top h1 {
        font-size: 21px
      }

      .rowi {
        flex-wrap: wrap
      }

      .rowi>button {
        margin-left: auto
      }

      .pgrid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr))
      }

      .addline {
        flex-wrap: wrap
      }

      .addline>button {
        flex: 1
      }

      .prev {
        max-width: 100%
      }

      .pj div {
        flex-direction: column;
        align-items: stretch;
        gap: 6px
      }

      .pj span {
        text-align: center
      }

      .pj button {
        width: 100%
      }
    }

    input[type=file]::file-selector-button {
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      margin-right: 10px;
      cursor: pointer
    }

    input[type=file]::file-selector-button:hover {
      border-color: var(--blue);
      background: var(--hover)
    }

    @media(pointer:coarse) {
      textarea {
        font-size: 16px !important
      }
    }

    /* the icon-code box sets 13px inline */

    select {
      width: 100%;
      font: inherit;
      color: inherit;
      background: var(--fill);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 14px;
      cursor: pointer
    }

    select:focus {
      outline: 0;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--ring)
    }

    select:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    select option {
      background: var(--panel);
      color: var(--ink)
    }

    .pj p.pcat {
      padding: 8px 10px 0
    }

    .pj p.pcat select {
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 8px
    }
  </style>
</head>

<body>
  <div id="loginBox" class="login">
    <button class="tm" type="button" aria-label="Switch to light mode"><svg class="i-sun" viewBox="0 0 24 24"
        aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
      </svg></button>
    <h1 style="font-size:36px">Admin</h1>
    <p class="lead" style="margin:6px 0 0">Sign in to manage the site.</p>
    <form id="login"><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"
        aria-label="Admin password"><button class="pri" type="submit">Sign
        in</button></form>
    <p id="loginMsg" role="alert" style="color:var(--bad);min-height:1.5em;margin-top:10px;font-size:14px"></p>
  </div>
  <div id="app" hidden>
    <div class="top">
      <h1>Site admin</h1><a href="/" target="_blank" rel="noopener">View site</a><button class="tm" type="button"
        aria-label="Switch to light mode"><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg></button><button id="out" type="button">Sign out</button>
    </div>
    <div class="wrap">
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <script>
      (function () {
        var key = sessionStorage.getItem("ak") || "", D = null, tab = sessionStorage.getItem("atab") || "About", fbTab = "pending";
        var $ = function (s) { return document.querySelector(s) };
        /* theme: shares the site's saved choice */
        var root = document.documentElement, tms = [].slice.call(document.querySelectorAll(".tm"));
        function setTheme(t, save) {
          root.setAttribute("data-theme", t); var l = t === "light" ? "Switch to dark mode" : "Switch to light mode";
          tms.forEach(function (b) { b.setAttribute("aria-label", l); b.title = l });
          if (save) { try { localStorage.setItem("theme", t) } catch (e) { } }
        }
        function curTheme() { return root.getAttribute("data-theme") === "light" ? "light" : "dark" }
        setTheme(curTheme(), false);
        tms.forEach(function (b) { b.addEventListener("click", function () { root.classList.add("tt"); setTheme(curTheme() === "light" ? "dark" : "light", true); setTimeout(function () { root.classList.remove("tt") }, 500) }) });
        addEventListener("storage", function (e) { if (e.key === "theme" && (e.newValue === "light" || e.newValue === "dark")) setTheme(e.newValue, false) });
        var TABS = ["About", "Services", "Qualification", "Projects", "Feedback", "Social", "Contact", "CV"];

        /* ---------- helpers ---------- */
        function h(t, a, k) { var e = document.createElement(t); a = a || {}; for (var x in a) { if (x === "text") e.textContent = a[x]; else if (x === "class") e.className = a[x]; else if (x.slice(0, 2) === "on") e[x] = a[x]; else e.setAttribute(x, a[x]) } (k || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c) }); return e }
        function fld(label, el, hint) { return h("div", { class: "fld" }, [h("label", { text: label }), el, hint ? h("p", { class: "hint", text: hint }) : null]) }
        function inp(v, a) { var e = h("input", Object.assign({ type: "text" }, a || {})); e.value = v || ""; return e }
        function area(v, a) { var e = h("textarea", a || {}); e.value = v || ""; return e }
        var tt = 0; function toast(m, bad) { var t = $("#toast"); t.textContent = m; t.className = "show" + (bad ? " bad" : ""); clearTimeout(tt); tt = setTimeout(function () { t.className = "" }, 3200) }
        function api(path, method, body) {
          return fetch(path, { method: method || "GET", headers: { "x-admin-key": key, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }).then(function (r) {
            return r.json().catch(function () { return {} }).then(function (j) {
              if (r.status === 401) { logout("Wrong password."); throw new Error("Wrong password.") }
              if (!r.ok) throw new Error(j.error || "Request failed."); return j
            });
          });
        }
        function saveC(path, body, msg, after) { return api("/api/index?p=admin/content/" + path, "POST", body).then(function (c) { D = c; toast(msg || "Saved."); if (after) after() }).catch(function (e) { toast(e.message, true) }) }
        function wrapIcon(code) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + code + '</svg>' }
        var TAGS = { path: 1, circle: 1, rect: 1, line: 1, polyline: 1, polygon: 1, ellipse: 1, g: 1 };
        function cleanIcon(code) {
          var c = String(code || "").trim().replace(/^<svg[^>]*>/i, "").replace(/<\/svg>\s*$/i, "").trim();
          if (!c || /<[^a-zA-Z\/]/.test(c) || /\bon\w+\s*=|javascript:|href\s*=/i.test(c)) return null;
          var t = c.match(/<\/?\s*[a-zA-Z][\w:-]*/g) || [];
          if (!t.length) return null;
          for (var i = 0; i < t.length; i++)if (!TAGS[t[i].replace(/[<\/\s]/g, "").toLowerCase()]) return null;
          return c;
        }
        function shrink(file) {
          return new Promise(function (ok, no) {
            var r = new FileReader();
            r.onerror = function () { no(new Error("Could not read that file.")) };
            r.onload = function () {
              var i = new Image();
              i.onerror = function () { no(new Error("That file is not a usable picture.")) };
              i.onload = function () {
                var s = Math.min(1, 1000 / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = Math.round(i.width * s); c.height = Math.round(i.height * s);
                var x = c.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0, 0, c.width, c.height); x.drawImage(i, 0, 0, c.width, c.height); var q = .82, u = c.toDataURL("image/jpeg", q); while (u.length > 600000 && q > .4) { q -= .08; u = c.toDataURL("image/jpeg", q) } ok(u)
              };
              i.src = r.result
            };
            r.readAsDataURL(file);
          });
        }

        /* ---------- session ---------- */
        function logout(msg) { key = ""; sessionStorage.removeItem("ak"); $("#app").hidden = true; $("#loginBox").hidden = false; $("#loginMsg").textContent = msg || "" }
        function start() {
          return api("/api/index?p=admin/content").then(function (c) { D = c; $("#loginBox").hidden = true; $("#app").hidden = false; drawTabs(); show(tab) });
        }
        $("#login").addEventListener("submit", function (e) {
          e.preventDefault(); key = $("#pw").value;
          start().then(function () { sessionStorage.setItem("ak", key); $("#pw").value = "" }).catch(function (x) { $("#loginMsg").textContent = x.message });
        });
        $("#out").onclick = function () { logout("") };
        if (key) start().catch(function () { logout("") });

        /* ---------- tabs ---------- */
        function drawTabs() {
          var t = $("#tabs"); t.textContent = "";
          TABS.forEach(function (n) { t.appendChild(h("button", { type: "button", class: n === tab ? "on" : "", text: n, onclick: function () { show(n) } })) });
        }
        function show(n) {
          tab = n; sessionStorage.setItem("atab", n); drawTabs();
          var p = $("#panel"); p.textContent = "";
          ({ About: About, Services: Services, Qualification: Qual, Projects: Projects, Feedback: Feedback, Social: Social, Contact: Contact, CV: CV })[n](p);
        }
        function card(title, lead) { return h("div", { class: "card" }, [h("h2", { text: title }), h("p", { class: "lead", text: lead || "" })]) }

        /* ---------- About ---------- */
        function About(p) {
          var a = D.about, c = card("About", "Shown in the About section of the site.");
          var hd = inp(a.heading, { maxlength: 160 }), pa = area(a.paragraphs.join("\n\n"), { rows: 8 }), em = inp(a.email, { type: "email", maxlength: 120 }), ph = inp(a.phone, { maxlength: 40 }), ad = inp(a.address, { maxlength: 160 }), lg = inp(D.qualification.languages, { maxlength: 200 });
          pa.style.minHeight = "190px";
          c.appendChild(fld("Headline", hd));
          c.appendChild(fld("Paragraphs", pa, "Separate paragraphs with a blank line."));
          c.appendChild(h("div", { class: "row2" }, [fld("Email", em), fld("Phone", ph, "Leave empty to hide it.")]));
          c.appendChild(fld("Address", ad, "Leave empty to hide it."));
          c.appendChild(fld("Languages", lg, "Leave empty to hide it."));
          c.appendChild(h("button", {
            type: "button", class: "pri", text: "Save about", onclick: function () {
              var q = D.qualification;
              saveC("about", { heading: hd.value, paragraphs: pa.value.split(/\n\s*\n/), email: em.value, phone: ph.value, address: ad.value }, "About saved.")
                .then(function () {
                  return saveC("qualification", { skills: q.skills, languages: lg.value, interests: q.interests }, "About saved.");
                });
            }
          }));
          p.appendChild(c);
        }

        /* ---------- Services ---------- */
        function Services(p) {
          var c = card("Services", "Add or remove the services listed on the site.");
          if (!D.services.length) c.appendChild(h("p", { class: "empty", text: "No services yet. The Services section is hidden until you add one." }));
          D.services.forEach(function (s) {
            var ic = h("div", { class: "ico" }); ic.innerHTML = wrapIcon(s.icon);
            c.appendChild(h("div", { class: "rowi" }, [ic, h("div", { class: "grow" }, [h("b", { text: s.title }), h("p", { text: s.desc })]),
              h("button", {
                type: "button", class: "del", text: "Remove", onclick: function () {
                  if (confirm('Remove "' + s.title + '"?')) saveC("services", { items: D.services.filter(function (x) { return x.id !== s.id }) }, "Service removed.", function () { show("Services") });
                }
              })]));
          });
          p.appendChild(c);
          var f = card("Add a service", "You'll need an icon code, a title and a short description.");
          var code = area("", { placeholder: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3"/>', rows: 4 }), ti = inp("", { maxlength: 60 }), de = inp("", { maxlength: 220 }), pv = h("div", { class: "ico" });
          code.style.fontFamily = "ui-monospace,Menlo,Consolas,monospace"; code.style.fontSize = "13px";
          code.addEventListener("input", function () { var k = cleanIcon(code.value); pv.innerHTML = k ? wrapIcon(k) : "" });
          f.appendChild(fld("Icon code", h("div", { class: "addline" }, [h("div", { style: "flex:1" }, [code]), pv]), "Paste SVG icon code: the shapes inside an <svg>, or the whole <svg>. 24x24 line icons look best (for example from lucide.dev or tabler.io/icons). Only path, circle, rect, line, polyline, polygon, ellipse and g are allowed."));
          f.appendChild(fld("Title", ti)); f.appendChild(fld("Short description", de));
          f.appendChild(h("button", {
            type: "button", class: "pri", text: "Add service", onclick: function () {
              if (!cleanIcon(code.value)) return toast("Paste valid SVG icon code first.", true);
              saveC("services", { items: D.services.concat([{ icon: code.value, title: ti.value, desc: de.value }]) }, "Service added.", function () { show("Services") });
            }
          }));
          p.appendChild(f);
          SkillsCard(p);
        }

        function SkillsCard(p) {
          var skills = D.qualification.skills.slice(), c = card("Skills", "Shown as chips at the bottom of the Services section.");
          var chips = h("div", { class: "chips" }), add = inp("", { maxlength: 40, placeholder: "Add a skill" });
          function draw() { chips.textContent = ""; skills.forEach(function (s, i) { chips.appendChild(h("span", { class: "chip" }, [s, h("button", { type: "button", "aria-label": "Remove " + s, text: "\u00d7", onclick: function () { skills.splice(i, 1); draw() } })])) }); if (!skills.length) chips.appendChild(h("span", { class: "empty", text: "No skills yet." })) }
          function push() { var v = add.value.trim(); if (v) { skills.push(v); add.value = ""; draw() } add.focus() }
          add.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); push() } });
          draw();
          c.appendChild(h("div", {}, [chips, h("div", { class: "addline" }, [add, h("button", { type: "button", text: "Add", onclick: push })])]));
          c.appendChild(h("button", {
            type: "button", class: "pri", style: "margin-top:16px", text: "Save skills", onclick: function () {
              var v = add.value.trim(); if (v) { skills.push(v); add.value = ""; draw() }
              var cur = D.qualification;
              saveC("qualification", { skills: skills, languages: cur.languages, interests: cur.interests }, "Skills saved.");
            }
          }));
          p.appendChild(c);
        }

        /* ---------- Qualification ---------- */
        function Qual(p) {
          var q = D.qualification, c = card("Qualification", "Interests. Education entries are not editable here.");
          var it = inp(q.interests, { maxlength: 200 });
          c.appendChild(fld("Interests", it, "Leave empty to hide."));
          c.appendChild(h("button", {
            type: "button", class: "pri", text: "Save qualification", onclick: function () {
              var cur = D.qualification;
              saveC("qualification", { skills: cur.skills, languages: cur.languages, interests: it.value }, "Qualification saved.");
            }
          }));
          p.appendChild(c);
        }

        /* ---------- Projects ---------- */
        function sel(opts, val) { var s = h("select"); opts.forEach(function (o) { var e = h("option", { value: o[0], text: o[1] }); if (o[0] === val) e.selected = true; s.appendChild(e) }); return s }
        function Projects(p) {
          var cats = D.categories || [], failed = function (e) { toast(e.message, true) };
          /* ----- categories ----- */
          var cc = card("Categories", "Projects are grouped by category on the site. Each category shows its first 3 projects, and a View all button opens the rest.");
          if (!cats.length) cc.appendChild(h("p", { class: "empty", text: "No categories yet. Create one before adding a project." }));
          cats.forEach(function (k) {
            var n = D.projects.filter(function (x) { return x.category === k.id }).length;
            cc.appendChild(h("div", { class: "rowi" }, [
              h("div", { class: "grow" }, [h("b", { text: k.name }), h("p", { text: n + (n === 1 ? " project" : " projects") })]),
              h("button", {
                type: "button", text: "Rename", onclick: function () {
                  var v = prompt("Rename category", k.name); if (v === null) return;
                  api("/api/index?p=admin/categories/" + k.id, "POST", { name: v }).then(function (x) { D = x; toast("Category renamed."); show("Projects") }).catch(failed);
                }
              }),
              h("button", {
                type: "button", class: "del", text: "Remove", onclick: function () {
                  if (confirm('Remove the category "' + k.name + '"?')) api("/api/index?p=admin/categories/" + k.id, "DELETE").then(function (x) { D = x; toast("Category removed."); show("Projects") }).catch(failed);
                }
              })]));
          });
          var cn = inp("", { maxlength: 40, placeholder: "New category name" });
          function addCat() {
            if (!cn.value.trim()) return toast("Enter a category name.", true);
            api("/api/index?p=admin/categories", "POST", { name: cn.value }).then(function (x) { D = x; toast("Category added."); show("Projects") }).catch(failed);
          }
          cn.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addCat() } });
          cc.appendChild(h("div", { class: "addline", style: "margin-top:14px" }, [cn, h("button", { type: "button", text: "Add category", onclick: addCat })]));
          p.appendChild(cc);

          /* ----- project list ----- */
          var c = card("Projects", "All projects. Use the menu on a card to move it to another category.");
          if (!D.projects.length) c.appendChild(h("p", { class: "empty", text: "No projects yet. The Projects section is hidden until you add one." }));
          var g = h("div", { class: "pgrid" }), opts = cats.map(function (k) { return [k.id, k.name] });
          D.projects.forEach(function (pr) {
            var known = cats.some(function (k) { return k.id === pr.category });
            var cs = sel((known ? [] : [["", "No category"]]).concat(opts), known ? pr.category : "");
            cs.setAttribute("aria-label", "Category of " + pr.title);
            cs.addEventListener("change", function () {
              if (!cs.value) return;
              api("/api/index?p=admin/projects/" + pr.id, "POST", { category: cs.value }).then(function (x) { D = x; toast("Project moved."); show("Projects") }).catch(function (e) { toast(e.message, true); show("Projects") });
            });
            g.appendChild(h("div", { class: "pj" }, [h("img", { src: pr.image, alt: "" }), h("p", { class: "pcat" }, [cs]), h("div", {}, [h("span", { text: pr.title, title: pr.title }), h("button", {
              type: "button", class: "del", text: "Remove", onclick: function () {
                if (confirm('Remove "' + pr.title + '"?')) api("/api/index?p=admin/projects/" + pr.id, "DELETE").then(function (x) { D = x; toast("Project removed."); show("Projects") }).catch(failed);
              }
            })])]));
          });
          c.appendChild(g); p.appendChild(c);

          /* ----- add a project ----- */
          var f = card("Add a project", "A title, a link, a category and a picture. Landscape (3:2) pictures fit the cards best."), ti = inp("", { maxlength: 80 }), ur = inp("", { maxlength: 500, inputmode: "url", placeholder: "https://www.youtube.com/watch?v=..." }),
            cs2 = sel([["", cats.length ? "Choose a category" : "Create a category first"]].concat(opts), ""),
            file = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp" }), pv = h("img", { class: "prev", alt: "", hidden: "" }), b;
          if (!cats.length) cs2.disabled = true;
          file.addEventListener("change", function () { var fl = file.files[0]; if (!fl) { pv.hidden = true; return } pv.src = URL.createObjectURL(fl); pv.hidden = false });
          f.appendChild(fld("Title", ti));
          f.appendChild(fld("Project URL", ur, "YouTube and Vimeo links and direct .mp4 files play inside the site. Any other link opens in a new tab."));
          f.appendChild(fld("Category", cs2));
          f.appendChild(fld("Picture", h("div", {}, [file, pv])));
          b = h("button", {
            type: "button", class: "pri", text: "Add project", onclick: function () {
              if (!ti.value.trim()) return toast("Enter a project title.", true);
              if (!ur.value.trim()) return toast("Enter the project URL.", true);
              if (!cs2.value) return toast(cats.length ? "Choose a category." : "Create a category first.", true);
              if (!file.files[0]) return toast("Choose a picture.", true);
              b.disabled = true; b.textContent = "Uploading\u2026";
              shrink(file.files[0]).then(function (img) { return api("/api/index?p=admin/projects", "POST", { title: ti.value, url: ur.value, category: cs2.value, image: img }) })
                .then(function (x) { D = x; toast("Project added."); show("Projects") })
                .catch(function (e) { toast(e.message, true); b.disabled = false; b.textContent = "Add project" });
            }
          });
          f.appendChild(b); p.appendChild(f);
        }

        /* ---------- Feedback ---------- */
        function Feedback(p) {
          var c = card("Feedback", "Approve or reject what visitors send, or add feedback yourself."), t = h("div", { class: "tabs" });
          ["pending", "approved", "rejected", "add"].forEach(function (s) { t.appendChild(h("button", { type: "button", class: s === fbTab ? "on" : "", text: s === "add" ? "Add feedback" : s.charAt(0).toUpperCase() + s.slice(1), onclick: function () { fbTab = s; show("Feedback") } })) });
          c.appendChild(t); p.appendChild(c);
          var box = h("div"); c.appendChild(box);
          if (fbTab === "add") return addFb(box);
          api("/api/index?p=admin/feedback&status=" + fbTab).then(function (items) {
            if (!items.length) return box.appendChild(h("p", { class: "empty", text: "Nothing here." }));
            items.forEach(function (f) {
              var who = h("div", {}, [h("b", { text: f.name })]);
              if (f.anonymous) who.appendChild(h("span", { class: "tag", text: "Posts as Anonymous" }));
              if (f.fake) who.appendChild(h("span", { class: "tag", text: "Added by admin" }));
              function set(s) { return function () { api("/api/index?p=admin/feedback/" + f.id, "POST", { status: s }).then(function () { toast("Moved to " + s + "."); show("Feedback") }).catch(function (e) { toast(e.message, true) }) } }
              var a = h("div", { class: "act" });
              if (f.status !== "approved") a.appendChild(h("button", { type: "button", class: "pri", text: "Approve", onclick: set("approved") }));
              if (f.status !== "rejected") a.appendChild(h("button", { type: "button", text: "Reject", onclick: set("rejected") }));
              if (f.status !== "pending") a.appendChild(h("button", { type: "button", text: "Back to pending", onclick: set("pending") }));
              a.appendChild(h("button", { type: "button", class: "del", text: "Delete", onclick: function () { if (confirm("Delete this feedback permanently?")) api("/api/index?p=admin/feedback/" + f.id, "DELETE").then(function () { show("Feedback") }).catch(function (e) { toast(e.message, true) }) } }));
              box.appendChild(h("div", { class: "rowi", style: "display:block" }, [who, h("p", { class: "q", text: f.message }), h("div", { class: "meta", text: new Date(f.createdAt).toLocaleString() }), a]));
            });
          }).catch(function (e) { toast(e.message, true) });
        }
        function addFb(box) {
          var nm = inp("", { maxlength: 60 }), ms = area("", { maxlength: 500, rows: 5 }), dt = h("input", { type: "datetime-local" }),
            r1 = h("input", { type: "radio", name: "w", value: "name", checked: "" }), r2 = h("input", { type: "radio", name: "w", value: "anon" });
          box.appendChild(fld("Name", nm, "Always stored. Visitors only see it if you choose to show it."));
          box.appendChild(fld("Feedback message", ms, "10 to 500 characters."));
          box.appendChild(fld("How should the name appear on the site?", h("div", { class: "opts" }, [h("label", {}, [r1, "Show the name"]), h("label", {}, [r2, "Post as Anonymous"])])));
          box.appendChild(fld("Date (optional)", dt, "Leave empty to use now."));
          box.appendChild(h("button", {
            type: "button", class: "pri", text: "Add and publish", onclick: function () {
              api("/api/index?p=admin/feedback", "POST", { name: nm.value, message: ms.value, anonymous: r2.checked, createdAt: dt.value ? new Date(dt.value).toISOString() : "" })
                .then(function () { toast("Feedback published."); fbTab = "approved"; show("Feedback") }).catch(function (e) { toast(e.message, true) });
            }
          }));
        }

        /* ---------- CV ---------- */
        var CV_MAX = 3 * 1024 * 1024; /* matches the server: Vercel allows 4.5 MB request bodies and base64 adds about a third */
        function readPdf(file) {
          return new Promise(function (ok, no) {
            var r = new FileReader();
            r.onerror = function () { no(new Error("Could not read that file.")) };
            r.onload = function () { ok(String(r.result).replace(/^data:[^;,]*/, "data:application/pdf")) };
            r.readAsDataURL(file);
          });
        }
        function CV(p) {
          var cur = D.cv && D.cv.url ? D.cv : null, c = card("CV", "The PDF behind the Download CV buttons in the header and the About section. Until you upload one, both buttons stay hidden.");
          if (cur) {
            c.appendChild(h("div", { class: "rowi" }, [
              h("div", { class: "grow" }, [h("b", { text: cur.name || "CV.pdf" }), h("p", {}, [h("a", { href: cur.url, download: cur.name || "CV.pdf", text: "Download current CV" })])]),
              h("button", {
                type: "button", class: "del", text: "Remove", onclick: function () {
                  if (confirm("Remove the CV? The download buttons will disappear from the site.")) saveC("cv", { name: "", data: "" }, "CV removed.", function () { show("CV") });
                }
              })
            ]));
          } else c.appendChild(h("p", { class: "empty", text: "No CV uploaded yet." }));
          p.appendChild(c);
          var f = card(cur ? "Replace the CV" : "Upload a CV", "PDF only, up to 3 MB."), file = h("input", { type: "file", accept: "application/pdf,.pdf" }), b;
          f.appendChild(fld("PDF file", file));
          b = h("button", {
            type: "button", class: "pri", text: cur ? "Replace CV" : "Upload CV", onclick: function () {
              var fl = file.files[0], label = cur ? "Replace CV" : "Upload CV";
              if (!fl) return toast("Choose a PDF file.", true);
              if (!/\.pdf$/i.test(fl.name) && fl.type !== "application/pdf") return toast("That is not a PDF.", true);
              if (fl.size > CV_MAX) return toast("That file is too large (3 MB max).", true);
              b.disabled = true; b.textContent = "Uploading\u2026";
              readPdf(fl).then(function (data) { return api("/api/index?p=admin/content/cv", "POST", { name: fl.name.replace(/[\\\/]/g, "_"), data: data }) })
                .then(function (x) { D = x; toast("CV saved."); show("CV") })
                .catch(function (e) { toast(e.message, true); b.disabled = false; b.textContent = label });
            }
          });
          f.appendChild(b); p.appendChild(f);
        }

        /* ---------- Social ---------- */
        function Social(p) {
          var s = D.social || {}, c = card("Social links", "Shown in the Social section, just above Contact. Leave a field empty to hide that icon. If every field is empty, the whole section is hidden.");
          var ig = inp(s.instagram, { maxlength: 300, placeholder: "https://instagram.com/yourname" }),
            li = inp(s.linkedin, { maxlength: 300, placeholder: "https://linkedin.com/in/yourname" }),
            fb = inp(s.facebook, { maxlength: 300, placeholder: "https://facebook.com/yourname" }),
            wa = inp(s.whatsapp ? "+" + s.whatsapp : "", { maxlength: 40, placeholder: "+8801712345678", inputmode: "tel" });
          c.appendChild(fld("Instagram", ig, "Paste your profile link."));
          c.appendChild(fld("LinkedIn", li, "Paste your profile link."));
          c.appendChild(fld("Facebook", fb, "Paste your profile or page link."));
          c.appendChild(fld("WhatsApp number", wa, "Include the country code (Bangladesh is +880) and leave out the leading 0. Tapping the icon opens a WhatsApp chat with this number."));
          c.appendChild(h("button", {
            type: "button", class: "pri", text: "Save social links", onclick: function () {
              saveC("social", { instagram: ig.value, linkedin: li.value, facebook: fb.value, whatsapp: wa.value }, "Social links saved.", function () { show("Social") });
            }
          }));
          p.appendChild(c);
        }

        /* ---------- Contact ---------- */
        function Contact(p) {
          var c = card("Contact", "The email used by the Email me button and the footer."), em = inp(D.contactEmail, { type: "email", maxlength: 120 });
          c.appendChild(fld("Contact email", em, "The email in the About section is changed under About."));
          c.appendChild(h("button", { type: "button", class: "pri", text: "Save email", onclick: function () { saveC("contact", { email: em.value }, "Contact email saved.") } }));
          p.appendChild(c);
        }
      })();
  </script>
